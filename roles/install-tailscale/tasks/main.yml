- name: Get preAuthKey
  thermiontech.headscale.get_pre_auth_key:
    headscale_url: "https://headscale.thermion.tech"
    api_key: "{{ headscale_api_key }}"

- name: Install and configure tailscale
  ansible.builtin.include_role:
    name: artis3n.tailscale.machine
  vars:
    tailscale_args: "--login-server='https://headscale.thermion.tech' --reset --accept-dns=false"
    tailscale_authkey: "{{ headscale_preAuthKey }}"